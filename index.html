<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src *; style-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;">

    <title>Canon</title>
    <meta name="description" content="Canon, a Bible reading program">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Canon</h1>
        <h2>A Bible reading program where you can't get behind</h2>
    </header>

    <main x-data="app">
        <div class="startScreen" x-show="isStartScreen">
            <button @click="createPlan">Start new</button>
            <button @click="continuePlan">Continue</button>
        </div>

        <div class="continueScreen" x-show="isContinueScreen">
            <p>Select the last chapter you read for each day:</p>
            <!-- loop the days from the selected plan -->
            <button @click="createContinuation">Start</button>
        </div>

        <div class="planScreen" x-show="isPlanScreen">
            <!-- loop the days from the selected plan -->
        </div>
    </main>
    <!-- <script type="module" src="js/app.js"></script> -->
    <script src="js/app.js"></script> <!-- use for local dev -->
</body>
</html>
