<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src *; style-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;"> -->

    <title>Canon</title>
    <meta name="description" content="Canon, a Bible reading program">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Canon</h1>
        <p>The Bible reading plan where you can’t get behind!</p>
    </header>

    <main x-data="app">
        <div class="startScreen" x-show="$store.screens.current === 'start' && localStorage.getItem('version') == null">
            <button @click="createPlan">Start New</button>
            <button @click="continuePlan">Continue Plan</button>
        </div>

        <div class="continueScreen" x-show="$store.screens.current === 'continue' && localStorage.getItem('version') == null">
            <p>Select the last chapter you read for each day:</p>
            <!-- loop the days from the selected plan -->
            <button @click="createContinuation">Start</button>
        </div>

        <div class="planScreen" x-show="$store.screens.current === 'plan' || localStorage.getItem('version') != null">
            <h2 x-text="todayLong"></h2>
            <!-- <p x-text="JSON.stringify(planDay)"></p>
            <p x-text="JSON.stringify(chaptersRead)"></p>
            <p x-text="JSON.stringify(progress)"></p>
            <p x-text="JSON.stringify(currentProgress)"></p> -->
            <section class="chapters">
                <template x-for="chapter in planDay">
                    <div class="chapter-container">
                        <div class="flex-child checkbox-parent">
                            <input type="checkbox" class="check-box" x-model="chaptersRead" @click="chapterClick" :id="chapter.id" :value="chapter.id" :disabled="chapter.id != planDay[0].id && !chaptersRead.includes((chapter.id - 1).toString())" x-effect="if(chaptersRead.length > 0) { localStorage.setItem(today, Math.max(...chaptersRead)); localStorage.setItem('firstCheckedToday', Math.min(...chaptersRead)); localStorage.setItem('lastUpdated', (new Date).toLocaleString( 'sv', { timeZoneName: 'short' } ).slice(0, 10)); }">
                            <label :for="chapter.id" class="check-box"></label> <!-- inside square of the checkbox -->
                        </div>
                        <div class="flex-child">
                            <label :for="chapter.id" x-text="`${chapter.book == 'Psalms' ? 'Psalm' : chapter.book} ${chapter.number}`" class="chapter-label"></label> <!-- normal text label -->
                        </div>
                    </div>
                </template>
            </section>
        </div>
    </main>
    <!-- <script type="module" src="js/app.js"></script> -->
    <script src="js/app.js"></script> <!-- use for local dev -->

    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('/serviceworker.js')
            .then( function (registration) {
                console.log("Registered service worker", registration.scope);
            })
            .catch( function (error) {
                console.error("Failed to register service worker", error);
            });
        }
    </script>
</body>
</html>
