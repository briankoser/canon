<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src *; style-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;"> -->

    <title>Canon</title>
    <meta name="description" content="Canon, a Bible reading program">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Canon</h1>
        <span>The Bible reading plan where you can't get behind!</span>
    </header>

    <main x-data="app">
        <div class="startScreen" x-show="$store.screens.current === 'start'">
            <button @click="createPlan">Start New</button>
            <button @click="continuePlan">Continue Plan</button>
        </div>

        <div class="continueScreen" x-show="$store.screens.current === 'continue'">
            <p>Select the last chapter you read for each day:</p>
            <!-- loop the days from the selected plan -->
            <button @click="createContinuation">Start</button>
        </div>

        <div class="planScreen" x-show="$store.screens.current === 'plan'">
            <h2 x-text="todayLong"></h2>
            <p x-text="JSON.stringify(planDay)"></p>
            <p x-text="JSON.stringify(chaptersRead)"></p>
            <p x-text="JSON.stringify(progress)"></p>
            <p x-text="JSON.stringify(currentProgress)"></p>
            <template x-for="chapter in planDay">
                <div>
                    <input type="checkbox" x-model="chaptersRead" @click="chapterClick" :id="chapter.id" :value="chapter.id" :disabled="chapter.id != planDay[0].id && !chaptersRead.includes((chapter.id - 1).toString())">
                    <label x-text="`${chapter.book} ${chapter.number}`" :for="chapter.id"></label>
                </div>
            </template>
        </div>
    </main>
    <!-- <script type="module" src="js/app.js"></script> -->
    <script src="js/app.js"></script> <!-- use for local dev -->
</body>
</html>
