<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src *; style-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;"> -->

    <title>Canon</title>
    <meta name="description" content="Canon, a Bible reading program">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Canon</h1>
        <p>The Bible reading plan where you can’t get behind!</p>
    </header>

    <main x-data="app">
        <div class="startScreen" x-show="$store.screens.current === 'start' && localStorage.getItem('version') == null">
            <button @click="createPlan">Start New</button>
            <button @click="continuePlan">Continue Plan</button>
        </div>

        <div class="continueScreen" x-cloak x-show="$store.screens.current === 'continue' && localStorage.getItem('version') == null">
            <p>Select the last chapter you read for each day:</p>
            
            <section class="continuePlanDays">
                <!-- <template x-for="day in plans[version]">
                    <div class="day-container">
                        <label x-text="day.day"></label>
                        <select x-model="sundayBook">
                            <template x-for="book in day.books">
                                <option x-text="book.title"></option>
                            </template>
                        </select>
                        <select>
                            <template x-for="i in day.books[0].chapters">
                                <option x-text="i"></option>
                            </template>
                        </select>
                    </div>
                </template> -->

                <!-- <p x-text="JSON.stringify(continueSundayBook)"></p>
                <p x-text="JSON.stringify(continueSundayChapter)"></p>
                <p x-text="JSON.stringify(continueMondayBook)"></p>
                <p x-text="JSON.stringify(continueMondayChapter)"></p>
                <p x-text="JSON.stringify(continueTuesdayBook)"></p>
                <p x-text="JSON.stringify(continueTuesdayChapter)"></p>
                <p x-text="JSON.stringify(continueWednesdayBook)"></p>
                <p x-text="JSON.stringify(continueWednesdayChapter)"></p>
                <p x-text="JSON.stringify(continueThursdayBook)"></p>
                <p x-text="JSON.stringify(continueThursdayChapter)"></p>
                <p x-text="JSON.stringify(continueFridayBook)"></p>
                <p x-text="JSON.stringify(continueFridayChapter)"></p>
                <p x-text="JSON.stringify(continueSaturdayBook)"></p>
                <p x-text="JSON.stringify(continueSaturdayChapter)"></p> -->

                <div class="day-container">
                    <label>Sunday</label>
                    <select x-model="continueSundayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Sunday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueSundayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Sunday').books.find(b => b.title === continueSundayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Monday</label>
                    <select x-model="continueMondayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Monday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueMondayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Monday').books.find(b => b.title === continueMondayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Tuesday</label>
                    <select x-model="continueTuesdayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Tuesday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueTuesdayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Tuesday').books.find(b => b.title === continueTuesdayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Wednesday</label>
                    <select x-model="continueWednesdayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Wednesday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueWednesdayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Wednesday').books.find(b => b.title === continueWednesdayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Thursday</label>
                    <select x-model="continueThursdayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Thursday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueThursdayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Thursday').books.find(b => b.title === continueThursdayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Friday</label>
                    <select x-model="continueFridayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Friday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueFridayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Friday').books.find(b => b.title === continueFridayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>

                <div class="day-container">
                    <label>Saturday</label>
                    <select x-model="continueSaturdayBook">
                            <option></option>
                        <template x-for="book in plans[version].find(d => d.day === 'Saturday').books">
                            <option x-text="book.title"></option>
                        </template>
                    </select>
                    <select x-model="continueSaturdayChapter">
                            <option></option>
                        <template x-for="i in (plans[version].find(d => d.day === 'Saturday').books.find(b => b.title === continueSaturdayBook) || {'chapters': 0}).chapters">
                            <option x-text="i"></option>
                        </template>
                    </select>
                </div>
            </section>
            <button @click="createContinuation">Save Plan</button>
        </div>

        <div class="planScreen" x-cloak x-show="$store.screens.current === 'plan' || localStorage.getItem('version') != null">
            <h2 x-text="todayLong"></h2>
            <!-- <p x-text="JSON.stringify(planDay)"></p>
            <p x-text="JSON.stringify(chaptersRead)"></p>
            <p x-text="JSON.stringify(progress)"></p> -->
            <section class="chapters">
                <template x-for="chapter in planDay">
                    <div class="chapter-container">
                        <div class="flex-child checkbox-parent">
                            <input type="checkbox" class="check-box" x-model="chaptersRead" :id="chapter.id" :value="chapter.id" :disabled="chapter.id != planDay[0].id && !chaptersRead.includes((chapter.id - 1).toString())" x-effect="if(chaptersRead.length > 0) { localStorage.setItem(todayDay, Math.max(...chaptersRead)); localStorage.setItem('firstCheckedToday', Math.min(...chaptersRead)); localStorage.setItem('lastUpdated', (new Date).toLocaleString( 'sv', { timeZoneName: 'short' } ).slice(0, 10)); }">
                            <label :for="chapter.id" class="check-box"></label> <!-- inside square of the checkbox -->
                        </div>
                        <div class="flex-child">
                            <label :for="chapter.id" x-text="`${chapter.book == 'Psalms' ? 'Psalm' : chapter.book} ${chapter.number}`" class="chapter-label"></label> <!-- normal text label -->
                        </div>
                    </div>
                </template>
            </section>
        </div>
    </main>
    <!-- <script type="module" src="js/app.js"></script> -->
    <script src="js/app.js"></script> <!-- use for local dev -->

    <script>
        if (navigator.serviceWorker) {
            navigator.serviceWorker.register('/serviceworker.js')
            .then( function (registration) {
                console.log("Registered service worker", registration.scope);
            })
            .catch( function (error) {
                console.error("Failed to register service worker", error);
            });
        }
    </script>
</body>
</html>
