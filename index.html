<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src *; style-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net;">

    <title>Canon</title>
    <meta name="description" content="Canon, a Bible reading program">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Canon</h1>
        <span>A Bible reading program where you can't get behind</span>
    </header>

    <main x-data="app">
        <div class="startScreen" x-show="$store.screens.current === 'start'">
            <button @click="createPlan">Start new</button>
            <button @click="continuePlan">Continue</button>
        </div>

        <div class="continueScreen" x-show="$store.screens.current === 'continue'">
            <p>Select the last chapter you read for each day:</p>
            <!-- loop the days from the selected plan -->
            <button @click="createContinuation">Start</button>
        </div>

        <div class="planScreen" x-show="$store.screens.current === 'plan'">
            <select x-model="selectedDay">
                <template x-for="day in ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday']">
                    <option x-text="day"></option>
                </template>
            </select>
            <h2 x-text="selectedDay"></h2>
            <p x-text="selectedPlanDay.dailyChapters"></p>
            <template x-for="(book, bookIndex) in selectedPlanDay.books">
                <div>
                    <h3 x-text="book.title"></h3>
                    <template x-for="(chapter, chapterIndex) in book.chapters">
                        <div>
                            <label x-text="chapter" :for="`${selectedPlanDay.day}-${(bookIndex * 1000) + chapterIndex}`"></label>
                            <input type="checkbox" x-model="chaptersRead" @click="chapterClick"
                                :id="`${selectedPlanDay.day}-${(bookIndex * 1000) + chapterIndex}`" 
                                :value="`${selectedPlanDay.day}-${(bookIndex * 1000) + chapterIndex}`">
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </main>
    <!-- <script type="module" src="js/app.js"></script> -->
    <script src="js/app.js"></script> <!-- use for local dev -->
</body>
</html>
